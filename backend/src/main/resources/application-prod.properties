# =====================================================
# ROOMBAY - PRODUCTION PROFILE (Railway / Render / VPS)
# =====================================================
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All values MUST come from host environment variables.
# =====================================================

# =====================================================
# DATABASE (Render PostgreSQL)
# =====================================================
# DATABASE_URL may be JDBC or Railway-style postgresql://; DotenvEnvironmentPostProcessor normalizes Railway URLs.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.initialization-fail-timeout=${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:1}

# JPA - NEVER use update/create in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =====================================================
# FLYWAY
# =====================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}

# =====================================================
# JWT
# =====================================================
spring.jwt.secret=${JWT_SECRET}
spring.jwt.access-token-expiration=3600000
spring.jwt.refresh-token-expiration=604800000

# =====================================================
# EMAIL
# =====================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================
# CLOUDINARY
# =====================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =====================================================
# APPLICATION
# =====================================================
app.base-url=${APP_BASE_URL}
app.frontend-url=${APP_FRONTEND_URL}
app.oauth.google.enabled=${APP_OAUTH_GOOGLE_ENABLED:true}
server.port=${PORT:8082}

# =====================================================
# CORS (set in Render env vars)
# =====================================================
# Example: https://www.roombay.app,https://roombay.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# =====================================================
# SWAGGER - Disabled in production
# =====================================================
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# =====================================================
# ACTUATOR (restrict in production)
# =====================================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# =====================================================
# LOGGING
# =====================================================
logging.level.root=WARN
logging.level.org.rooms.roombay=INFO
logging.level.org.springframework.security=WARN

# =====================================================
# REDIS (Disabled for MVP — enable after remote host is configured)
# =====================================================
spring.data.redis.enabled=${SPRING_DATA_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=simple

# =====================================================
# SEARCH (OpenSearch/Elasticsearch on VPS — disabled at launch by default)
# =====================================================
roombay.search.elasticsearch.enabled=${ROOMBAY_SEARCH_ELASTICSEARCH_ENABLED:false}
roombay.search.elasticsearch.index-name=listings
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

# =====================================================
# AI / RAG (Ollama on VPS or OpenAI via env)
# =====================================================
roombay.ai.ingest-dev-key=${ROOMBAY_AI_INGEST_DEV_KEY:}
roombay.ai.embedding-dimensions=${AI_EMBEDDING_DIMENSIONS:768}
roombay.ai.graph-rag-enabled=${ROOMBAY_AI_GRAPH_RAG:true}
roombay.ai.memory.enabled=false

# =====================================================
# DEV SEED (must stay off in production)
# =====================================================
app.dev.seed-landlord.enabled=${APP_DEV_SEED_LANDLORD_ENABLED:false}

# =====================================================
# ADMIN SEED (enable temporarily to create admin, then disable)
# =====================================================
app.admin.seed.enabled=${APP_ADMIN_SEED_ENABLED:false}
app.admin.seed.email=${APP_ADMIN_SEED_EMAIL:}
app.admin.seed.password=${APP_ADMIN_SEED_PASSWORD:}
app.admin.seed.first-name=${APP_ADMIN_SEED_FIRST_NAME:Admin}
app.admin.seed.last-name=${APP_ADMIN_SEED_LAST_NAME:User}

# =====================================================
# PAYMENTS (platform MoMo fallbacks when landlord has no number)
# =====================================================
roombay.payments.platform-mtn-momo=${ROOMBAY_PLATFORM_MTN_MOMO:}
roombay.payments.platform-orange-money=${ROOMBAY_PLATFORM_ORANGE_MONEY:}

# =====================================================
# SENTRY
# =====================================================
sentry.dsn=${SENTRY_DSN:}
sentry.environment=production
sentry.send-default-pii=false
