# =====================================================
# ROOMBUDDY - PRODUCTION PROFILE (Render)
# =====================================================
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All values MUST come from Render environment variables.
# =====================================================

# =====================================================
# DATABASE (Render PostgreSQL)
# =====================================================
# Render provides DATABASE_URL in JDBC format
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA - NEVER use update/create in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =====================================================
# FLYWAY (Disabled for now - using Hibernate auto-update)
# =====================================================
spring.flyway.enabled=false

# =====================================================
# JWT
# =====================================================
spring.jwt.secret=${JWT_SECRET}
spring.jwt.access-token-expiration=3600000
spring.jwt.refresh-token-expiration=604800000

# =====================================================
# EMAIL
# =====================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================
# CLOUDINARY
# =====================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =====================================================
# APPLICATION
# =====================================================
app.base-url=${APP_BASE_URL}
server.port=${PORT:8080}

# =====================================================
# CORS (set in Render env vars)
# =====================================================
# Example: https://roombuddy-frontend.onrender.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# =====================================================
# SWAGGER - Disabled in production
# =====================================================
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# =====================================================
# ACTUATOR (restrict in production)
# =====================================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# =====================================================
# LOGGING
# =====================================================
logging.level.root=WARN
logging.level.org.rooms.roombuddy=INFO
logging.level.org.springframework.security=WARN

# =====================================================
# REDIS (Disabled for MVP)
# =====================================================
spring.data.redis.enabled=false
spring.cache.type=simple
