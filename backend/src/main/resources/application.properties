spring.application.name=RoomBay
# =====================================================
# APPLICATION CONFIGURATION
# =====================================================
# Override if 8082 is in use: SERVER_PORT=8083 or add to .env
server.port=${SERVER_PORT:8082}

# Local .env: DotenvEnvironmentPostProcessor loads backend/.env or ./.env (see META-INF/spring/)
# OS env vars still override .env. Run the JVM with working directory = repo root so backend/.env is found.

# =====================================================
# DATABASE CONFIGURATION
# =====================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/roomconnect_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Dialect is auto-detected, no need to specify (removes warning)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =====================================================
# FLYWAY CONFIGURATION
# =====================================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0



# =====================================================
# SWAGGER/OpenAPI
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true

## JWT Configuration (HS256 needs >= 32 bytes â override JWT_SECRET in production)
spring.jwt.secret=${JWT_SECRET:roombay-local-dev-only-unsafe-change-me-use-64chars-minimum!!}
spring.jwt.access-token-expiration=3600000
spring.jwt.refresh-token-expiration=604800000

# Email Configuration (for password reset)
# Optional explicit From address (defaults to MAIL_USERNAME when unset)
app.mail.from=${MAIL_FROM:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Configuration
app.base-url=${APP_BASE_URL:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Onboarding: value-first — do not block API or login until email/phone verified (remind in UI).
# Set enforce-for-api=true for stricter production policy.
app.verification.enforce-for-api=false
app.verification.require-for-login=false
# Defer verification email until after first sessions (or enable from admin).
app.email.send-verification-on-register=false

# Google OAuth: set true and provide GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET; whitelist redirect URI in Google Cloud Console.
app.oauth.google.enabled=false

# =====================================================
# WHATSAPP BUSINESS API CONFIGURATION
# =====================================================
# Set whatsapp.api.enabled=true when ready to use WhatsApp Business API
# Get credentials from: https://developers.facebook.com/apps/
whatsapp.api.enabled=false
whatsapp.api.url=https://graph.facebook.com/v18.0
whatsapp.api.token=
whatsapp.api.phone-number-id=

# =====================================================
# CLOUDINARY CONFIGURATION
# =====================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# =====================================================
# ACTUATOR CONFIGURATION (Health & Metrics)
# =====================================================
# Expose health, info, metrics, and prometheus endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Application info
management.info.env.enabled=true
info.app.name=RoomBay
info.app.description= Housing Platform for Cameroon
info.app.version=1.0.0

# Prometheus metrics
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# =====================================================
# REDIS CONFIGURATION (Optional)
# =====================================================
# Set spring.data.redis.enabled=true to enable Redis
# If Redis is not available, the app will use in-memory cache
spring.data.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.cache.type=simple
spring.cache.cache-names=listings,recommendations,matches,profiles,notifications

# =====================================================
# RATE LIMITING CONFIGURATION
# =====================================================
# Requests per minute for different endpoints
ratelimit.login.requests-per-minute=10
ratelimit.register.requests-per-minute=5
ratelimit.api.requests-per-minute=100
ratelimit.search.requests-per-minute=30
ratelimit.user.requests-per-minute=100
ratelimit.ip.requests-per-minute=50
# Auth endpoint filter (in-memory): login/register/refresh/forgot-password
ratelimit.auth.login-max-per-hour=30
ratelimit.auth.register-max-per-minute=8
ratelimit.auth.refresh-max-per-minute=60
ratelimit.auth.forgot-password-max-per-hour=10
# AI assistant (in-memory per user; independent of Redis)
ratelimit.ai.chat.requests-per-minute=20

# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# =====================================================
# CORS CONFIGURATION
# =====================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =====================================================
# LOGGING CONFIGURATION
# =====================================================
logging.level.org.rooms.roombay=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =====================================================
# SEARCH INDEX OUTBOX (Elasticsearch/OpenSearch readiness)
# =====================================================
# roombay.search.indexer.interval-ms=15000
# roombay.search.indexer.batch-size=50

# Elasticsearch: set true in .env when localhost:9200 (or your cluster) is running.
# When false, NoOpSearchIndexClient is used â avoids startup failures if ES is not running locally.
roombay.search.elasticsearch.enabled=true
roombay.search.elasticsearch.index-name=listings
spring.elasticsearch.uris=http://localhost:9200

# =====================================================
# AI / RAG (Ollama + optional OpenAI)
# =====================================================
# Self-hosted only: AI_PROVIDER=ollama and do not set OPENAI_API_KEY.
# Auto uses OpenAI when OPENAI_API_KEY is set unless AI_PROVIDER=ollama.
# AI_PROVIDER=${AI_PROVIDER:auto}
# OPENAI_API_KEY=
# OLLAMA_BASE_URL=${OLLAMA_BASE_URL:http://localhost:11434}
# OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:llama3.2}
# OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
# AI_DOCS_DIR=../docs
# Local doc ingest without an admin user: set ROOMBAY_AI_INGEST_DEV_KEY in .env (long random string).
# POST /api/ai/ingest-dev with header X-RoomBay-Ingest-Key. Leave unset in production.
roombay.ai.ingest-dev-key=${ROOMBAY_AI_INGEST_DEV_KEY:}
# Ollama nomic-embed-text = 768; OpenAI text-embedding-3-small = 1536
roombay.ai.embedding-dimensions=${AI_EMBEDDING_DIMENSIONS:768}

# GraphRAG: hybrid vector seed + entity-graph neighbors (Postgres). Disable to use flat top-K only.
roombay.ai.graph-rag-enabled=${ROOMBAY_AI_GRAPH_RAG:true}
roombay.ai.graph-rag-seed-k=8
roombay.ai.graph-rag-final-k=8
roombay.ai.graph-rag-expand-limit=16
roombay.ai.graph-vector-weight=0.65
roombay.ai.graph-edge-weight=0.35

# Short-term memory (LangGraph). Keep off by default until validated per environment.
roombay.ai.memory.enabled=${ROOMBAY_AI_MEMORY_ENABLED:false}
roombay.ai.memory.provider=${ROOMBAY_AI_MEMORY_PROVIDER:langgraph}
roombay.ai.memory.max-turns=${ROOMBAY_AI_MEMORY_MAX_TURNS:6}
roombay.ai.memory.request-timeout-ms=${ROOMBAY_AI_MEMORY_TIMEOUT_MS:2000}
roombay.ai.memory.langgraph.base-url=${ROOMBAY_AI_MEMORY_LANGGRAPH_BASE_URL:http://localhost:8123}
roombay.ai.memory.langgraph.api-key=${ROOMBAY_AI_MEMORY_LANGGRAPH_API_KEY:}

# =====================================================
# SENTRY (set in .env or host secrets — do not commit tokens)
# =====================================================
sentry.dsn=${SENTRY_DSN:}
# Add data like request headers and IP for users,
# see https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/ for more info
sentry.send-default-pii=true
# SENTRY_AUTH_TOKEN is for Sentry CLI/source maps in CI only; never store in this file.