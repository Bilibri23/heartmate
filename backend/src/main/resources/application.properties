spring.application.name=Roombuddy
# =====================================================
# APPLICATION CONFIGURATION
# =====================================================
server.port=8082
# Load local env files explicitly for dev runs (repo root and backend dir).
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]

# Local env: see BackendDotenvEnvironmentPostProcessor + BackendEnvFileSupport (backend/.env)

# =====================================================
# DATABASE CONFIGURATION
# =====================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/roomconnect_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Dialect is auto-detected, no need to specify (removes warning)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =====================================================
# FLYWAY CONFIGURATION
# =====================================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0



# =====================================================
# SWAGGER/OpenAPI
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true

## JWT Configuration
# JWT_SECRET must be >= 32 bytes for HS256. Set JWT_SECRET in OS env or backend/.env.
# Fallback is LOCAL DEV ONLY — override in production via JWT_SECRET / application-prod.
spring.jwt.secret=${JWT_SECRET:local-dev-only-change-me-use-env-or-backend-dotenv-32b}
spring.jwt.access-token-expiration=3600000
spring.jwt.refresh-token-expiration=604800000

# Email Configuration (for password reset)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Configuration
app.base-url=${APP_BASE_URL:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# =====================================================
# WHATSAPP BUSINESS API CONFIGURATION
# =====================================================
# Set whatsapp.api.enabled=true when ready to use WhatsApp Business API
# Get credentials from: https://developers.facebook.com/apps/
whatsapp.api.enabled=false
whatsapp.api.url=https://graph.facebook.com/v18.0
whatsapp.api.token=
whatsapp.api.phone-number-id=

# =====================================================
# CLOUDINARY CONFIGURATION
# =====================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# =====================================================
# ACTUATOR CONFIGURATION (Health & Metrics)
# =====================================================
# Expose health, info, metrics, and prometheus endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Application info
management.info.env.enabled=true
info.app.name=RoomBuddy
info.app.description=Student Housing Platform for Cameroon
info.app.version=1.0.0

# Prometheus metrics
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# =====================================================
# REDIS CONFIGURATION (Optional)
# =====================================================
# Set spring.data.redis.enabled=true to enable Redis
# If Redis is not available, the app will use in-memory cache
spring.data.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.cache.type=simple
spring.cache.cache-names=listings,recommendations,matches,profiles,notifications

# =====================================================
# RATE LIMITING CONFIGURATION
# =====================================================
# Requests per minute for different endpoints
ratelimit.login.requests-per-minute=10
ratelimit.register.requests-per-minute=5
ratelimit.api.requests-per-minute=100
ratelimit.search.requests-per-minute=30
ratelimit.user.requests-per-minute=100
ratelimit.ip.requests-per-minute=50

# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# =====================================================
# CORS CONFIGURATION
# =====================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =====================================================
# LOGGING CONFIGURATION
# =====================================================
logging.level.org.rooms.roombuddy=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =====================================================
# SEARCH INDEX OUTBOX (Elasticsearch/OpenSearch readiness)
# =====================================================
# roombuddy.search.indexer.interval-ms=15000
# roombuddy.search.indexer.batch-size=50

# Elasticsearch: set to true and set spring.elasticsearch.uris to use real search index.
# When false or unset, NoOpSearchIndexClient is used (outbox still processed, no index).
roombuddy.search.elasticsearch.enabled=true
roombuddy.search.elasticsearch.index-name=listings
spring.elasticsearch.uris=http://localhost:9200

# Sentry runtime config (optional in local dev; required in prod)
sentry.dsn=${SENTRY_DSN:}
# Add request/user context only when needed; review privacy implications.
sentry.send-default-pii=${SENTRY_SEND_DEFAULT_PII:true}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.release=${SENTRY_RELEASE:${spring.application.name}@dev}
# Distributed tracing sample rate (0.0 - 1.0). Keep low in production unless needed.
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}