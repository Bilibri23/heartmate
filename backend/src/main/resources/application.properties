spring.application.name=Roombuddy
# =====================================================
# APPLICATION CONFIGURATION
# =====================================================
server.port=8082

# Environment variables are loaded automatically by dotenv-vault-spring-boot-starter
# It looks for .env file in the project root and backend directory

# =====================================================
# DATABASE CONFIGURATION
# =====================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/roomconnect_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Dialect is auto-detected, no need to specify (removes warning)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =====================================================
# FLYWAY CONFIGURATION
# =====================================================
# Disable Flyway for now - using Hibernate auto-update instead
spring.flyway.enabled=false
# spring.flyway.baseline-on-migrate=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-version=0



# =====================================================
# SWAGGER/OpenAPI
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true

## JWT Configuration
spring.jwt.secret=${JWT_SECRET:0de4254db96d719a05ae240b84f07401e1bc309d98d240dfdbca7827b2b515c1}
spring.jwt.access-token-expiration=3600000
spring.jwt.refresh-token-expiration=604800000

# Email Configuration (for password reset)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Configuration
app.base-url=${APP_BASE_URL:}

# =====================================================
# WHATSAPP BUSINESS API CONFIGURATION
# =====================================================
# Set whatsapp.api.enabled=true when ready to use WhatsApp Business API
# Get credentials from: https://developers.facebook.com/apps/
whatsapp.api.enabled=false
whatsapp.api.url=https://graph.facebook.com/v18.0
whatsapp.api.token=
whatsapp.api.phone-number-id=

# =====================================================
# CLOUDINARY CONFIGURATION
# =====================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dm3pjmuni}
cloudinary.api-key=${CLOUDINARY_API_KEY:363818716595163}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:nNlZtdSMAcmr5BpUYRGlyNsk7kM}

# =====================================================
# ACTUATOR CONFIGURATION (Health & Metrics)
# =====================================================
# Expose health, info, metrics, and prometheus endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Application info
management.info.env.enabled=true
info.app.name=RoomBuddy
info.app.description=Student Housing Platform for Cameroon
info.app.version=1.0.0

# Prometheus metrics
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# =====================================================
# REDIS CONFIGURATION (Optional)
# =====================================================
# Set spring.data.redis.enabled=true to enable Redis
# If Redis is not available, the app will use in-memory cache
spring.data.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.cache.type=simple
spring.cache.cache-names=listings,recommendations,matches,profiles,notifications

# =====================================================
# RATE LIMITING CONFIGURATION
# =====================================================
# Requests per minute for different endpoints
ratelimit.login.requests-per-minute=10
ratelimit.register.requests-per-minute=5
ratelimit.api.requests-per-minute=100
ratelimit.search.requests-per-minute=30
ratelimit.user.requests-per-minute=100
ratelimit.ip.requests-per-minute=50

# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# =====================================================
# CORS CONFIGURATION
# =====================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =====================================================
# LOGGING CONFIGURATION
# =====================================================
logging.level.org.rooms.roombuddy=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n