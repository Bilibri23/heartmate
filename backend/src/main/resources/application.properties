spring.application.name=Roombuddy
# =====================================================
# APPLICATION CONFIGURATION
# =====================================================
server.port=8080

# =====================================================
# DATABASE CONFIGURATION
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/roomconnect_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Dialect is auto-detected, no need to specify (removes warning)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =====================================================
# FLYWAY CONFIGURATION
# =====================================================
# Disable Flyway for now - using Hibernate auto-update instead
spring.flyway.enabled=false
# spring.flyway.baseline-on-migrate=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-version=0



# =====================================================
# SWAGGER/OpenAPI
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true

## JWT Configuration
spring.jwt.secret=your-256-bit-secret-key-change-in-production-minimum-32-characters
spring.jwt.access-token-expiration=3600000
spring.jwt.refresh-token-expiration=604800000

# Email Configuration (for password reset)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noblesseb7@gmail.com
spring.mail.password=ajqn uluu jodd djwi
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Configuration
app.base-url=http://localhost:5173

# =====================================================
# WHATSAPP BUSINESS API CONFIGURATION
# =====================================================
# Set whatsapp.api.enabled=true when ready to use WhatsApp Business API
# Get credentials from: https://developers.facebook.com/apps/
whatsapp.api.enabled=false
whatsapp.api.url=https://graph.facebook.com/v18.0
whatsapp.api.token=
whatsapp.api.phone-number-id=

# =====================================================
# CLOUDINARY CONFIGURATION
# =====================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:do9vj3e0l}
cloudinary.api-key=${CLOUDINARY_API_KEY:638513396149293}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:Jf1fuPhzKkDdR_74ad3XsB4VrKI}

# =====================================================
# ACTUATOR CONFIGURATION (Health & Metrics)
# =====================================================
# Expose health, info, metrics, and prometheus endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Application info
management.info.env.enabled=true
info.app.name=RoomBuddy
info.app.description=Student Housing Platform for Cameroon
info.app.version=1.0.0

# Prometheus metrics
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# =====================================================
# REDIS CONFIGURATION (Optional)
# =====================================================
# Set spring.data.redis.enabled=true to enable Redis
# If Redis is not available, the app will use in-memory cache
spring.data.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.cache.type=simple
spring.cache.cache-names=listings,recommendations,matches,profiles,notifications

# =====================================================
# RATE LIMITING CONFIGURATION
# =====================================================
# Requests per minute for different endpoints
ratelimit.login.requests-per-minute=10
ratelimit.register.requests-per-minute=5
ratelimit.api.requests-per-minute=100
ratelimit.search.requests-per-minute=30
ratelimit.user.requests-per-minute=100
ratelimit.ip.requests-per-minute=50

# =====================================================
# LOGGING CONFIGURATION
# =====================================================
logging.level.org.rooms.roombuddy=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n