# RoomBay Docker Compose - Development Override
# 
# This file is used for local development with hot-reloading.
# It mounts source code as volumes so changes are reflected immediately.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Or create an alias:
#   alias dc-dev="docker-compose -f docker-compose.yml -f docker-compose.dev.yml"
#   dc-dev up

version: '3.8'

services:
  # ==================== BACKEND (Development Mode) ====================
  backend:
    build:
      context: ../backend
      dockerfile: ../backend/Dockerfile
    # Override to use development profile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_JPA_SHOW_SQL: "true"
      LOGGING_LEVEL_ORG_ROOMS_ROOMBAY: DEBUG
    # Mount source for faster development (requires rebuild for changes)
    # For true hot-reload, run backend outside Docker with `mvn spring-boot:run`
    volumes:
      - ./backend/src:/app/src:ro

  # ==================== FRONTEND (Development Mode) ====================
  # For development, it's better to run frontend outside Docker with `npm run dev`
  # This gives you hot module replacement (HMR)
  frontend:
    build:
      context: ./frontend/room8
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/room8:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    command: npm run dev -- --host 0.0.0.0
