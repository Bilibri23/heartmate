# RoomBay self-hosted AI stack — copy to Hetzner VPS: ~/roombay/docker-compose.yml
# Usage: docker compose -f docker-compose.yml up -d
#
# After start:
#   docker exec ollama ollama pull qwen2.5:1.5b
#   docker exec ollama ollama pull nomic-embed-text
#
# Lock down ports (P7): restrict 11434/9200/6379 to Railway egress or use VPN/tunnel.
# At launch, set ROOMBAY_SEARCH_ELASTICSEARCH_ENABLED=false on Railway until OpenSearch is secured.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 5G

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # NOTE: The standalone LangGraph sidecar (ai-orchestrator) has been retired. Agentic actions
  # (save / apply / request-visit) now run natively in the Spring backend
  # (service/AiAgentActionRouter), so there is no separate Python service to deploy and the
  # orchestrator flag stays false. The ai-orchestrator/ source is kept in the repo as a
  # reference/thesis artefact only. To re-introduce the sidecar, restore a service that builds
  # ../ai-orchestrator, exposes port 8131, and set ROOMBAY_AI_ORCHESTRATOR_ENABLED=true.

volumes:
  ollama_data:
  opensearch_data:
  redis_data:
