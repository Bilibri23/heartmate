# RoomBay self-hosted AI stack — copy to Hetzner VPS: ~/roombay/docker-compose.yml
# Usage: docker compose -f docker-compose.yml up -d
#
# After start:
#   docker exec ollama ollama pull qwen2.5:1.5b
#   docker exec ollama ollama pull nomic-embed-text
#
# Lock down ports (P7): restrict 11434/9200/6379 to Railway egress or use VPN/tunnel.
# At launch, set ROOMBAY_SEARCH_ELASTICSEARCH_ENABLED=false on Railway until OpenSearch is secured.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 5G

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # RoomBay AI Orchestrator (LangGraph sidecar). Build from repo: ../ai-orchestrator
  # Optional: only run when the orchestrator feature is enabled on the backend.
  # Lock down port 8131 to the backend's egress (same as 11434/9200/6379).
  ai-orchestrator:
    build: ../ai-orchestrator
    container_name: ai-orchestrator
    restart: unless-stopped
    environment:
      # Backend base URL (Railway API) the sidecar calls for read-only tools.
      - ROOMBAY_API_BASE_URL=${ROOMBAY_API_BASE_URL:-http://host.docker.internal:8082}
      # Must match the backend's roombay.ai.internal.token.
      - ROOMBAY_INTERNAL_TOKEN=${ROOMBAY_INTERNAL_TOKEN:-}
      # Reuse the VPS Ollama for generation (or set AI_PROVIDER=openai + OPENAI_API_KEY).
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PORT=8131
    ports:
      - "8131:8131"
    depends_on:
      - ollama

volumes:
  ollama_data:
  opensearch_data:
  redis_data:
